/* ============ التركيز ============ */
const fo = {mode:'work', running:false, endAt:0, left:25 * 60, startedAt:0, taskId:'', timer:null};

}

  fo.mode = wasWork ? 'break' : 'work'; fo.left = (fo.mode === 'work' ? 25 : 5) * 60;

}

/* ============ الاستيراد ============ */
const normTime = v => { const m = latin(v ?? '').trim().match(/^(\d{1,2}):(\d{2})/); return m && +m[1] < 24 && +m[2] < 60 ? pad(+m[1]) + ':' + m[2] : ''; };
const latin = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function normDate(v) {
  if (v == null || v === '') return today();
  if (v instanceof Date) return isNaN(v) ? today() : ds(v);
  if (typeof v === 'number') { if (v > 1e11) return ds(new Date(v)); if (v > 20000 && v < 80000) return ds(new Date(Math.round((v - 25569) * 86400000) + new Date().getTimezoneOffset() * 60000)); }
  const s = latin(v).trim(); let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/); if (m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  const d = new Date(s); return isNaN(d) ? today() : ds(d);
}
const truthy = v => v === true || /^(true|1|yes|y|done|نعم|مكتمل|مكتملة|تم|✓|x)$/i.test(String(v ?? '').trim());
function pick(o, ...keys) { for (const k of keys) if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; return undefined; }
function normTask(o) {
  if (typeof o === 'string') o = {title:o};
  const title = pick(o, 'title', 'text', 'name', 'task', 'العنوان', 'المهمة', 'عنوان'); if (!title) return null;
  const rawAmt = pick(o, 'amount', 'money', 'المبلغ'); let amount = parseFloat(latin(rawAmt)) || 0;
  let ty = String(pick(o, 'type', 'amountType', 'النوع') ?? '').toLowerCase(), type = 'none';
  if (/income|^in$|دخل|\+/.test(ty)) type = 'in'; else if (/expense|^out$|مصروف|-/.test(ty)) type = 'out';
  if (amount < 0) { amount = -amount; type = 'out'; }
  if (amount > 0 && type === 'none') type = 'out'; if (!amount) type = 'none';
  const pr = String(pick(o, 'priority', 'prio', 'الأولوية') ?? '').toLowerCase();
  const prio = /high|عال|^h$|urgent|^3$/.test(pr) ? 'h' : /low|منخفض|^l$|^1$/.test(pr) ? 'l' : 'm';
  let subsRaw = pick(o, 'subs', 'subtasks', 'المهام الفرعية') || [];
  if (typeof subsRaw === 'string') subsRaw = subsRaw.split(/\s*\|\s*|[,،]/).map(s => s.trim()).filter(Boolean);
  const subs = subsRaw.map(s => {
    if (typeof s === 'string') { const d = /^✓/.test(s); return {t:s.replace(/^[✓○]\s*/, ''), d}; }

const AZKAR = {"sets":{"morning":[{"id":"z01","t":"الْحَمْدُ لِلَّهِ وَحْدَهُ، وَالصَّلاَةُ وَالسَّلاَمُ عَلَى مَنْ لاَ نَبِيَّ بَعْدَهُ","n":1,"g":"hasan","f":"استحباب ابتداء الدعاء بالحمد لله -تعالى- والثناء، ثم الصلاة على رسول الله ﷺ","s":"عن أنس يرفعه: ((لأن أقعد مع قوم يذكرون اللَّه تعالى من صلاة الغداة حتى تطلع الشمس أحبُّ إليَّ من أن أُعتق أربعة من ولد إسماعيل، ولأن أقعد مع قوم يذكرون اللَّه من صلاة العصر إلى أن تغرب الشمس أحبّ إليَّ من أن أعتق أربعة)). أبو داود، برقم 3667، وحسنه الألباني، في صحيح أبي داود، 2/698 ."},{"id":"z02","t":"أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ ﴿اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالْأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾","n":1,"g":"sahih","f":"[سورة البقرة، الآية: 255] من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير منهم حتى يصبح","s":"أخرجه الحاكم، 1/562، وصححه الألباني في صحيح الترغيب والترهيب، 1/273، وعزاه إلى النسائي، والطبراني، وقال: ((إسناد الطبراني جيد)).","q":1},{"id":"z04","t":"قُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ","n":3,"g":"sahih","f":"من قالها ثلاث مرات حين يصبح وحين يمسي كفته من كل شيء","s":"أخرجه أبو داود، 4/ 322، برقم 5082، والترمذي، 5/ 567، برقم 3575، وانظر: صحيح الترمذي، 3/182.","q":1},{"id":"z05","t":"قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","n":3,"g":"sahih","f":"من قالها ثلاث مرات حين يصبح وحين يمسي كفته من كل شيء","s":"أخرجه أبو داود، 4/ 322، برقم 5082، والترمذي، 5/ 567، برقم 3575، وانظر: صحيح الترمذي، 3/182.","q":1},{"id":"z06","t":"قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ، مَلِكِ ٱلنَّاسِ، ري في الأدب المفرد، برقم 1201، والنسائي في عمل اليوم والليلة، برقم 9، وابن السني، برقم 70، وحسّن سماحة الشيخ ابن باز ‘ إسناد النسائي، وأبي داود، في تحفة الأخيار، ص23."},{"id":"z14","t":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","n":1,"g":"hasan","f":"من قالها حين يصبح فقد أدَّى شكر يومه، ومن قالها حين يمسي فقد أدَّى شكر ليلته","s":"أخرجه أبو داود، 4/ 318، برقم 5073، والنسائي في عمل اليوم والليلة، برقم 7، وابن السني، برقم 41، وابن حبان، ((موارد)) برقم 2361، وحسّن ابن باز ‘ إسناده في تحفة الأخيار، ص24."},{"id":"z16","t":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ، لاَ إِلَهَ إِلاَّ أَنْتَ","n":3,"g":"hasan","s":"أبو داود، 4/ 324، برقم 5090، وأحمد، 5/ 42، برقم 20430، والنسائي في عمل اليوم والليلة، برقم 22، وابن السني، برقم 69، والبخاري في الأدب المفرد، برقم 701، وحسّن العلامة ابن باز ‘ إسناده في تحفة الأخيار، ص26."},{"id":"z17","t":"حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","n":7,"g":"dispute","f":"من قالها حين يصبح وحين يمسي سبع مرات كفاه اللَّه ما أهمّه من أمر الدنيا والآخرة","s":"أخرجه ابن السني، برقم 71 مرفوعاً، وأبو داود موقوفاً، 4/ 321، برقم 5081، وصحّح إسناده شعيب وعبدالقادر الأرناؤوط. انظر: زاد المعاد 2/376.","w":"موقوف على أبي الدرداء رضي الله عنه (إسناده صحيح عند الأرناؤوط) وروي مرفوعًا"},{"id":"z18","t":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ: فِي دِينِي وَدُنْيَايَ وَأَهْلِي، وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَينِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","n":1,"g":"sahih","s":"أبو داود، برقم 5074، وابن ماجه، برقم 3871، وانظر: صحيح ابن ماجه، 2/332."},{"id":"z19","t":"اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطانِ وَشَرَكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","n":1,"g":"sahih","s":"الترمذي، برقم 3392، وأبو داود، برقم 5067،. وانظر: صحيح الترمذي، 3/142."},{"id":"z20","t":"بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلاَ فِي السّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","n":3,"g":"sahih","f":"من قالها ثلاثاً إذا أصبح، وثلاثاً إذا أمسى لم يضره شيء","s":"أخرجه أبو داود، 4/ 323، برقم، 5088، والترمذي، 5/ 465، برقم 3388، وابن ماجه، برقم 3869، وأحمد، برقم 446. وانظر: صحيح ابن ماجه، 2/332، وحسّن إسناده العلامة ابن باز ‘ في تحفة الأخيار، ص39."},{"id":"z21","t":"رَضِيتُ بِاللَّهِ رَبَّاً، وَبِالْإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ ﷺ نَبِيًّا","n":3,"g":"hasan","f":"من قالها ثلاثاً حين يصبح وثلاثاً حين يمسي كان حقاً على اللَّه أن يرضيه يوم القيامة","s":"أحمد، 4/ 337، برقم 18967، والنسائي في عمل اليوم والليلة، برقم 4، وابن السني، برقم 68، وأبو داود، 4/ 318، برقم 1531، والترمذي، 5/ 465، برقم، 3389، وحسّنه ابن باز ‘ في تحفة الأخيار ص39."},{"id":"z22","t":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغيثُ أَصْلِحْ لِي شَأْنِيَ كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","n":1,"g":"sahih","s":"الحاكم وصححه، ووافقه الذهبي، 1/545، وانظر: صحيح الترغيب والترهيب، 1/273."},{"id":"z23","t":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ: فَتْحَهُ، وَنَصْرَهُ، وَنورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ","n":1,"g":"hasan","s":"أبو داود، 4/ 322، برقم 5084، وحسن إسناده شعيب وعبد القادر الأرناؤوط في تحقيق زاد المعاد، 2/373."},{"id":"z25","t":"أَصْبَحْنا عَلَى فِطْرَةِ الْإِسْلاَمِ، وَعَلَى كَلِمَةِ الْإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ الْمُشرِكِينَ","n":1,"g":"sahih","s":"أحمد، 3/ 406، و407، برقم 15360، ورقم 15563، وابن السني في عمل اليوم والليلة، برقم 34، وانظر: صحيح الجامع، 4/209."},{"id":"z27","t":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعاً، وَرِزْقاً طَيِّباً، وَعَمَلاً مُتَقَبَّلاً","n":1,"g":"hasan","s":"أخرجه ابن السني في ((عمل اليوم والليلة)) برقم (54)، وابن ماجة برقم (925)، وحسن إسناده عبدالقادر وشعيب الأرناؤوط، في تحقيق ((زاد المعاد)) (2/375)."},{"id":"z28","t":"لاَ إِلَهَ إِلاَّ اللَّهُ، وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","n":10,"g":"sahihayn","f":"عشرَ مرَّات أَوْ مرَّةً واحدةً عندَ الكَسَلِ، ومن قالها عَشْرَ مِرَارٍ كَانَ كَمَنْ أَعْتَقَ أَرْبَعَةَ أَنْفُسٍ مِنْ وَلَدِ إِسْمَاعِيلَ.","s":"صحيح البخاري: 6404، صحيح مسلم: 2693، النسائي في عمل اليوم والليلة، برقم 24، وانظر: صحيح الترغيب والترهيب، 1/272، وتحفة الأخيار لابن باز ‘، ص44، وانظر فضلها في: ص146، حديث، رقم 255 مرَّةً واحدةً عندَ الكَسَلِ: أبو داود، برقم 5077، وابن ماجه، برقم 3798، وأحمد، برقم 8719، وانظر: صحيح الترغيب والترهيب، 1/270، وصحيح أبي داود، 3/957، وصحيح ابن ماجه، 2/331، وزاد المعاد، 2/377."},{"id":"z29","t":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبَيِّنَا مُحَمَّدٍ","n":10,"g":"dispute","f":"من صلّى عليَّ حين يصبح عشراً، وحين يمسي عشراً، أدركته شفاعتي يوم القيامة","s":"أخرجه الطبراني بإسنادين أحدهما جيد، انظر: مجمع الزوائد (10/120)، وصحيح الترغيب والترهيب (1/273) [برقم (656)]، وضعيف الترغيب والترهيب برقم: 396. وفي السلسلة الضعيفة برقم: 5788.","w":"مختلف في ثبوته: في المصدر ذكرٌ له في صحيح الترغيب وفي ضعيف الترغيب والسلسلة الضعيفة"},{"id":"z31","t":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ","n":3,"g":"sahihayn","s":"مسلم، 4/ 2090، برقم 2726."},{"id":"z32","t":"لاَ إِلَهَ إِلاَّ اللَّهُ، وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","n":100,"g":"sahihayn","f":"من قالها مائة مرة في يوم كانت له عدل عشر رقاب، وكُتِبَ له مائة حسنة، ومُحيت عنه مائة سيئة، وكانت له حرزاً من الشيطان يومه ذلك حتى يمسي، ولم يأت أحد بأفضل مما جاء به إلا أحد عمل أكثر من ذلك","s":"البخاري، 4/ 95، برقم 3293، ومسلم، 4/ 2071، برقم 2691 عشرَ مرَّات: النسائي في عمل اليوم والليلة، برقم 24، وانظر: صحيح الترغيب والترهيب، 1/272، وتحفة الأخيار لابن باز ‘، ص44، وانظر فضلها في: ص146، حديث، رقم 255 مرَّةً واحدةً عندَ الكَسَلِ: أبو داود، برقم 5077، وابن ماجه، برقم 3798، وأحمد، برقم 8719، وانظر: صحيح الترغيب والترهيب، 1/270، وصحيح أبي داود، 3/957، وصحيح ابن ماجه، 2/331، وزاد المعاد، 2/377."},{"id":"z33","t":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","n":100,"g":"sahihayn","s":"البخاري مع ((الفتح)) (11/101) [برقم (6307)]، ومسلم (4/2075) [برقم (2702)]."},{"id":"z34","t":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","n":100,"g":"sahihayn","f":"من قالها مائة مرة حين يصبح وحين يمسي لم يأت أحد يوم القيامة بأفضل مما جاء به إلا أحد قال مثل ما قال أو زاد عليه","s":"مسلم، 4/ 2071 برقم 2692."}],"evening":[{"id":"z01","t":"الْحَمْدُ لِلَّهِ وَحْدَهُ، وَالصَّلاَةُ وَالسَّلاَمُ عَلَى مَنْ لاَ نَبِيَّ بَعْدَهُ","n":1,"g":"hasan","f":"استحباب ابتداء الدعاء بالحمد لله -تعالى- والثناء، ثم الصلاة على رسول الله ﷺ","s":"عن أنس يرفعه: ((لأن أقعد مع قوم يذكرون اللَّه تعالى من صلاة الغداة حتى تطلع الشمس أحبُّ إليَّ من أن أُعتق أربعة من ولد إسماعيل، ولأن أقعد مع قوم يذكرون اللَّه من صلاة العصر إلى أن تغرب الشمس أحبّ إليَّ من أن أعتق أربعة)). أبو داود، برقم 3667، وحسنه الألباني، في صحيح أبي داود، 2/698 ."},{"id":"z02","t":"أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ ﴿اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالْأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾","n":1,"g":"sahih","f":"[سورة البقرة، الآية: 255] من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير منهم حتى يصبح","s":"أخرجه الحاكم، 1/562، وصححه الألباني في صحيح الترغيب والترهيب، 1/273، وعزاه إلى النسائي، والطبراني، وقال: ((إسناد الطبراني جيد)).","q":1},{"id":"z03","t":"أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ ﴿آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلآئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُواْ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ* لاَ يُكَلِّفُ اللَّهُ نَفْساً إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْراً كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَآ أَنتَ مَوْلاَنَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ﴾. [البقرة 285 - 286]","n":1,"g":"sahihayn","f":"من قرأ آيتين من آخر سورة البقرة في ليلة كفتاه.","s":"أخرجه البخاري (4008)، ومسلم (807).","q":1},{"id":"z04","t":"قُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ","n":3,"g":"sahih","f":"من قالها ثلاث مرات حين يصبح وحين يمسي كفته من كل شيء","s":"أخرجه أبو داود، 4/ 322، برقم 5082، والترمذي، 5/ 567، برقم 3575، وانظر: صحيح الترمذي، 3/182.","q":1},{"id":"z05","t":"قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","n":3,"g":"sahih","f":"من قالها ثلاث مرات حين يصبح وحين يمسي كفته من كل شيء","s":"أخرجه أبو داود، 4/ 322، برقم 5082، والترمذي، 5/ 567، برقم 3575، وانظر: صحيح الترمذي، 3/182.","q":1},{"id":"z06","t":"قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ، مَلِكِ ٱلنَّاسِ، إِلَٰهِ ٱلنَّاسِ، مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ، ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ، مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ","n":3,"g":"sahih","f":"من قالها ثلاث مرات حين يصبح وحين يمسي كفته من كل شيء","s":"أخرجه أبو داود، 4/ 322، برقم 5082، والترمذي، 5/ 567، برقم 3575، وانظر: صحيح الترمذي، 3/182.","q":1},{"id":"z08","t":"أمسينا وأمسى الملك للَّه، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رب أسألك خير ما في هذه الليلة، وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة، وشر ما بعدها، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","n":1,"g":"sahihayn","s":"مسلم، 4/ 2088، برقم 2723."},{"id":"z10","t":"اللَّهمَّ بِكَ أمسَينا وبِكَ أصبَحنا وبِكَ نَحيا وبِكَ نموتُ، وإليكَ المصيرُ","n":1,"g":"sahih","s":"الترمذي، 5/ 466، برقم 3391، وانظر: صحيح الترمذي 3/142."},{"id":"z11","t":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ","n":1,"g":"sahihayn","f":"وَمَنْ قَالَهَا مِنَ النَّهَارِ مُوقِنًا بِهَا، فَمَاتَ مِنْ يَوْمِهِ قَبْلَ أَنْ يُمْسِيَ، فَهُوَ مِنْ أَهْلِ الْجَنَّةِ، وَمَنْ قَالَهَا مِنَ اللَّيْلِ وَهُوَ مُوقِنٌ بِهَا، فَمَاتَ قَبْلَ أَنْ يُصْبِحَ، فَهُوَ مِنْ أَهْلِ الْجَنَّةِ","s":"أخرجه البخاري، 7/ 150، برقم 6306."},{"id":"z13","t":"اللَّهم إني أمسيت أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ","n":4,"g":"hasan","f":"من قالها حين يصبح، أو يمسي أربع مرات، أعتقه اللَّه من النار","s":"أخرجه أبو داود، 4/ 317، برقم 5069، والبخاري في الأدب المفرد، برقم 1201، والنسائي في عمل اليوم والليلة، برقم 9، وابن السني، برقم 70، وحسّن سماحة الشيخ ابن باز ‘ إسناد النسائي، وأبي داود، في تحفة الأخيار، ص23."},{"id":"z15","t":"اللَّهم ما أمسى بي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","n":1,"g":"hasan","f":"من قالها حين يصبح فقد أدَّى شكر يومه، ومن قالها حين يمسي فقد أدَّى شكر ليلته","s":"أخرجه أبو داود، 4/ 318، برقم 5073، والنسائي في عمل اليوم والليلة، برقم 7، وابن السني، برقم 41، وابن حبان، ((موارد)) برقم 2361، وحسّن ابن باز ‘ إسناده في تحفة الأخيار، ص24."},{"id":"z16","t":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ، لاَ إِلَهَ إِلاَّ أَنْتَ","n":3,"g":"hasan","s":"أبو داود، 4/ 324، برقم 5090، وأحمد، 5/ 42، برقم 20430، والنسائي في عمل اليوم والليلة، برقم 22، وابن السني، برقم 69، والبخاري في الأدب المفرد، برقم 701، وحسّن العلامة ابن باز ‘ إسناده في تحفة الأخيار، ص26."},{"id":"z17","t":"حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","n":7,"g":"dispute","f":"من قالها حين يصبح وحين يمسي سبع مرات كفاه اللَّه ما أهمّه من أمر الدنيا والآخرة","s":"أخرجه ابن السني، برقم 71 مرفوعاً، وأبو داود موقوفاً، 4/ 321، برقم 5081، وصحّح إسناده شعيب وعبدالقادر الأرناؤوط. انظر: زاد المعاد 2/376.","w":"موقوف على أبي الدرداء رضي الله عنه (إسناده صحيح عند الأرناؤوط) وروي مرفوعًا"},{"id":"z18","t":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ: فِي دِينِي وَدُنْيَايَ وَأَهْلِي، وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَينِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","n":1,"g":"sahih","s":"أبو داود، برقم 5074، وابن ماجه، برقم 3871، وانظر: صحيح ابن ماجه، 2/332."},{"id":"z19","t":"اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطانِ وَشَرَكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","n":1,"g":"sahih","s":"الترمذي، برقم 3392، وأبو داود، برقم 5067،. وانظر: صحيح الترمذي، 3/142."},{"id":"z20","t":"بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلاَ فِي السّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","n":3,"g":"sahih","f":"من قالها ثلاثاً إذا أصبح، وثلاثاً إذا أمسى لم يضره شيء","s":"أخرجه أبو داود، 4/ 323، برقم، 5088، والترمذي، 5/ 465، برقم 3388، وابن ماجه، برقم 3869، وأحمد، برقم 446. وانظر: صحيح ابن ماجه، 2/332، وحسّن إسناده العلامة ابن باز ‘ في تحفة الأخيار، ص39."},{"id":"z21","t":"رَضِيتُ بِاللَّهِ رَبَّاً، وَبِالْإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ ﷺ نَبِيًّا","n":3,"g":"hasan","f":"من قالها ثلاثاً حين يصبح وثلاثاً حين يمسي كان حقاً على اللَّه أن يرضيه يوم القيامة","s":"أحمد، 4/ 337، برقم 18967، والنسائي في عمل اليوم والليلة، برقم 4، وابن السني، برقم 68، وأبو داود، 4/ 318، برقم 1531، والترمذي، 5/ 465، برقم، 3389، وحسّنه ابن باز ‘ في تحفة الأخيار ص39."},{"id":"z22","t":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغيثُ أَصْلِحْ لِي شَأْنِيَ كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","n":1,"g":"sahih","s":"الحاكم وصححه، ووافقه الذهبي، 1/545، وانظر: صحيح الترغيب والترهيب، 1/273."},{"id":"z24","t":"أَمْسَيْنا وَأَمْسَى الْمُلْكُ للهِ رَبِّ الْعَالَمَيْنِ، اللَّهُمَّ إِنَّي أسْأَلُكَ خَيْرَ هَذَه اللَّيْلَةِ فَتْحَهَا ونَصْرَهَا، ونُوْرَهَا وبَرَكَتهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فيهِا وَشَرَّ مَا بَعْدَهَا","n":1,"g":"hasan","s":"أبو داود، 4/ 322، برقم 5084، وحسن إسناده شعيب وعبد القادر الأرناؤوط في تحقيق زاد المعاد، 2/373."},{"id":"z26","t":"أمسينا على فطرة الإسلام، وَعَلَى كَلِمَةِ الْإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ الْمُشرِكِينَ","n":1,"g":"sahih","s":"أحمد، 3/ 406، و407، برقم 15360، ورقم 15563، وابن السني في عمل اليوم والليلة، برقم 34، وانظر: صحيح الجامع، 4/209."},{"id":"z28","t":"لاَ إِلَهَ إِلاَّ اللَّهُ، وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","n":10,"g":"sahihayn","f":"عشرَ مرَّات أَوْ مرَّةً واحدةً عندَ الكَسَلِ، ومن قالها عَشْرَ مِرَارٍ كَانَ كَمَنْ أَعْتَقَ أَرْبَعَةَ أَنْفُسٍ مِنْ وَلَدِ إِسْمَاعِيلَ.","s":"صحيح البخاري: 6404، صحيح مسلم: 2693، النسائي في عمل اليوم والليلة، برقم 24، وانظر: صحيح الترغيب والترهيب، 1/272، وتحفة الأخيار لابن باز ‘، ص44، وانظر فضلها في: ص146، حديث، رقم 255 مرَّةً واحدةً عندَ الكَسَلِ: أبو داود، برقم 5077، وابن ماجه، برقم 3798، وأحمد، برقم 8719، وانظر: صحيح الترغيب والترهيب، 1/270، وصحيح أبي داود، 3/957، وصحيح ابن ماجه، 2/331، وزاد المعاد، 2/377."},{"id":"z29","t":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبَيِّنَا مُحَمَّدٍ","n":10,"g":"dispute","f":"من صلّى عليَّ حين يصبح عشراً، وحين يمسي عشراً، أدركته شفاعتي يوم القيامة","s":"أخرجه الطبراني بإسنادين أحدهما جيد، انظر: مجمع الزوائد (10/120)، وصحيح الترغيب والترهيب (1/273) [برقم (656)]، وضعيف الترغيب والترهيب برقم: 396. وفي السلسلة الضعيفة برقم: 5788.","w":"مختلف في ثبوته: في المصدر ذكرٌ له في صحيح الترغيب وفي ضعيف الترغيب والسلسلة الضعيفة"},{"id":"z30","t":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","n":3,"g":"sahih","f":"من قالها حين يمسي ثلاث مرات لم تضرّه حُمَة تلك الليلة","s":"، أخرجه أحمد، 2/ 290، برقم 7898، والنسائي في عمل اليوم والليلة، برقم 590، وابن السني، برقم 68، وانظر: صحيح الترمذي، 3/187، وصحيح ابن ماجه، 2/266، وتحفة الأخيار لابن باز، ص45."},{"id":"z34","t":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","n":100,"g":"sahihayn","f":"من قالها مائة مرة حين يصبح وحين يمسي لم يأت أحد يوم القيامة بأفضل مما جاء به إلا أحد قال مثل ما قال أو زاد عليه","s":"مسلم، 4/ 2071 برقم 2692."}],"sleep":[{"id":"sl02","t":"{ اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ }","n":1,"g":"sahihayn","f":"من قرأها إذا أوى إلى فراشه لم يزل عليه من الله حافظ ولا يقربه شيطان حتى يصبح","s":"البخاري مع الفتح 4/487","q":1},{"id":"sl03","t":"{ آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللّهِ وَمَلآئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُواْ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ * لاَ يُكَلِّفُ اللّهُ نَفْساً إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْراً كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنتَ مَوْلاَنَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ }","n":1,"g":"sahihayn","f":"من قرأهما في ليلة كفتاه","s":"البخاري مع الفتح 9/94 ومسلم 1/554 (الآيتان من سورة البقرة 285–286)","q":1},{"id":"sl01","t":"بسم الله الرحمن الرحيم { قُلْ هُوَ اللَّهُ أَحَدٌ*اللَّهُ الصَّمَدُ*لَمْ يَلِدْ وَلَمْ يُولَدْ*وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ} بسم الله الرحمن الرحيم {قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ*مِن شَرِّ مَا خَلَقَ*وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ*وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ * وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ } بسم الله الرحمن الرحيم { قُلْ أَعُوذُ بِرَبِّ النَّاسِ * مَلِكِ النَّاسِ * إِلَهِ النَّاسِ *مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ * الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ * مِنَ الْجِنَّةِ وَالنَّاسِ }","n":3,"g":"sahihayn","s":"البخاري مع الفتح 9/62ومسلم 4/1723","o":"يجمع كفّيه ثم ينفث فيهما ويقرأ المعوّذات، ثم يمسح بهما ما استطاع من جسده، يبدأ بالرأس والوجه، ويفعل ذلك ثلاث مرات","q":1},{"id":"sl04","t":"باسمك ربي وضعت جنبي وبك أرفعه إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين","n":1,"g":"sahihayn","s":"البخاري 11/ 126 .ومسلم 4/ 2084","o":"يقولها حين يضع جنبه للنوم"},{"id":"sl05","t":"اللهم خَلَقْتَ نفسي وأنت توفَّاها لك مماتها ومَحْياها، إن أحييتها فاحفظها وإن أمتها فاغفر لها، اللهم إني أسألك العافية","n":1,"g":"sahihayn","s":"رواه مسلم4/ 2083وأحمد بلفظه 2/79"},{"id":"sl06","t":"اللهم قني عذابك يوم تبعث عبادك","n":3,"g":"sahih","s":"أبو داود بلفظه 4/311 وانظر صحيح الترمذي3/ 143","o":"يضع يده اليمنى تحت خدّه ثم يقول"},{"id":"sl07","t":"باسمِكَ اللهم أموت وأحيا","n":1,"g":"sahihayn","s":"البخاري مع الفتح 11/113 ومسلم 4/ 2083"},{"id":"sl08","t":"سبحان الله","n":33,"g":"sahihayn","f":"خير لكم من خادم","s":"البخاري مع الفتح 7/71 ومسلم 4/2091"},{"id":"sl09","t":"الحمد لله","n":33,"g":"sahihayn","f":"خير لكم من خادم","s":"البخاري مع الفتح 7/71 ومسلم 4/2091"},{"id":"sl10","t":"الله أكبر","n":34,"g":"sahihayn","f":"خير لكم من خادم","s":"البخاري مع الفتح 7/71 ومسلم 4/2091"},{"id":"sl11","t":"اللهم ربَّ السموات السبع،ورب العرش العظيم،ربنا ورب كل شيء، فالق الحب والنوى، ومُنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذٌ بناصيته،اللهم أنت الأول فليس قبلك شيء،وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدَّيْنَ واغننا من الفقر","n":1,"g":"sahihayn","s":"مسلم 4/ 2084"},{"id":"sl12","t":"الحمد لله الذي أطعمنا وسقانا وكفانا وآوانا فكم ممن لا كافي له ولا مؤوي","n":1,"g":"sahihayn","s":"مسلم 4/ 2085"},{"id":"sl13","t":"اللهم عالم الغيب والشهادة، فاطر السموات والأرض، رب كل شيء ومليكه أشهد أن لا إله إلا أنت أعوذ بك من شر نفسي، ومن شر الشيطان وشركه وأن أقترف على نفسي سوءًا أو أجرَّه إلى مسلم","n":1,"g":"sahih","s":"أبو داود 4/ 317 وانظر صحيح سنن الترمذي3/ 142"},{"id":"sl14","t":"يقرأ { ألم } تنزيل السجدة، و { تبارك الذي بيده الملك }","n":1,"g":"sahih","s":"الترمذي والنسائي وانظر صحيح الجامع 4/ 255","o":"يقرأ سورة السجدة وسورة الملك","q":1},{"id":"sl15","t":"اللهم أسلمت نفسي إليك، وفوضت أمري إليك وألجأت ظهري إليك رهبةً ورغبةً إليك، لا ملجأ ولا منجا منك إلا إليك، آمنت بكتابك الذي أنزلت وبنبيك الذي أرسلت","n":1,"g":"sahihayn","f":"من قال ذلك فإن مات مات على الفطرة","s":"البخاري مع الفتح 11/113 ومسلم 4/2081","o":"إذا أخذت مضجعك فتوضأ وضوءك للصلاة ثم اضطجع على شقك الأيمن وقل"}],"after":[{"id":"ap01","t":"أستغفر الله","n":3,  في يوم مائة مرة حطت خطاياه ولو كانت مثل زبد البحر","s":"البخاري 7/168 ومسلم 4/ 2071 ، وانظر :فضل من قالها مائة مرة إذا أصبح وإذا أمسى"},{"id":"f07","t":"سبحان الله وبحمده، سبحان الله العظيم","n":100,"g":"sahihayn","f":"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن","s":"البخاري 7/167ومسلم 4/2072"},{"id":"f08","t":"سبحان الله العظيم وبحمده","n":100,"g":"sahih","f":"من قال سبحان الله العظيم وبحمده غرست له نخلة في الجنة","s":"أخرجه الترمذي 5/511 والحاكم 1/501 وصححه ووافقه الذهبي ، وانظر صحيح الجامع 5/531 وصحيح الترمذي 3/160"},{"id":"f09","t":"لا حول ولا قوة إلا بالله","n":100,"g":"sahihayn","f":"كنز من كنوز الجنة","s":"البخاري مع الفتح 11/ 213 ومسلم 4/2076"},{"id":"f10","t":"أستغفر الله وأتوب إليه","n":100,"g":"sahihayn","s":"البخاري مع ((الفتح)) (11/101) [برقم (6307)]، ومسلم (4/2075) [برقم (2702)]."},{"id":"f11","t":"اللهم اغفر لي وارحمني واهدني وعافني وارزقني","n":10,"g":"sahihayn","f":"تجمع لك دنياك وآخرتك","s":"مسلم 4/2073 وفي رواية لمسلم فإن هؤلاء تجمع لك ديناك وآخرتك"}]};
const AZ_TITLE = {morning:'أذكار الصباح', evening:'أذكار المساء', sleep:'أذكار النوم', after:'الأذكار بعد الصلاة'};
const AZ_GRADE = {sahihayn:['✅', 'في الصحيحين أو أحدهما', 'ok'], sahih:['✅', 'صحيح — بحسب التخريج المذكور', 'ok'], hasan:['🟡', 'حسن — بحسب التخريج المذكور', 'mid'], dispute:['⚠️', 'مختلف في ثبوته', 'warn'], check:['ℹ️', 'لم تُذكر درجته في المصدر — راجع التخريج', 'mid']};
const az = {mode:'', set:'', i:0, date:'', free:'', list:false};
function azLink(it) {
  if (it.az) return it.az;
  const m = {i_adhkar0:'morning', i_adhkar1:'evening', i_adhkar2:'sleep', i_adhkar3:'after', i_adhkar4:'free', i_adhkar5:'salat'};
  if (m[it.id]) return m[it.id];
  const n = it.name || '';
  if (/أذكار الصباح/.test(n)) return 'morning'; if (/أذكار المساء/.test(n)) return 'evening'; if (/أذكار النوم/.test(n)) return 'sleep';
  if (/بعد الصلاة/.test(n)) return 'after'; if (/الصلاة على النبي/.test(n)) return 'salat'; if (/ورد الذكر/.test(n)) return 'free';
  return '';
}
const azKey = (d, set, id) => d + '|' + set + '|' + id;
const azGet = (d, set, id) => +S.az.n[azKey(d, set, id)] || 0;
function azPut(d, set, id, v) { const k = azKey(d, set, id); if (v > 0) S.az.n[k] = v; else delete S.az.n[k]; }
const azList = set => AZKAR.sets[set] || [];
function azProg(d, set) { const L = azList(set); let done = 0; L.forEach(x => { if (azGet(d, set, x.id) >= x.n) done++; }); return {done, total:L.length}; }
const azAll = () => [...AZKAR.free, ...S.az.c.map(c => ({id:c.id, t:c.t, n:+c.n || 100, f:c.f || '', s:c.s || '', g:'', custom:1}))];
function azTotal(id) { let n = 0; for (const k in S.az.n) { const p = k.split('|'); if (p[1] === 'free' && p.slice(2).join('|') === id) n += +S.az.n[k] || 0; } return n; }
const azVib = ms => { if (S.settings.azVib !== false) try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function azItemFor(set) { for (const sec of S.mz.sections) for (const it of (sec.items || [])) if (it.type === 'check' && azLink(it) === set) return it; return null; }
function azCredit(set, date) { const it = azItemFor(set); if (!it) return false; mzGet(date, true).v[it.id] = 1; save(); if ($('#mzbody')) renderMizan(); return true; }
function azBadges(x) {
  let h = '';
  if (x.q) h += `<span class="azbd q">📖 ${t('قرآن كريم')}</span>`;
  const g = AZ_GRADE[x.g];
  if (g) h += `<span class="azbd ${g[2]}">${g[0]} ${x.q ? t('الفضل') + ': ' : ''}${t(g[1])}</span>`;
  return h;
}
function azCard(x) {
  const g = AZ_GRADE[x.g];
  let h = `<div style="text-align:center">${azBadges(x)}</div>`;
  if (x.g === 'dispute') h += `<div class="azw"><b>⚠️ ${t('تنبيه على صحة الحديث')}</b><br>${esc(x.w || t('مختلف في ثبوته'))}.<br>${t('الأحوط ألا تعتمد عليه إلا بعد مراجعة أهل العلم، ويمكنك تجاوزه.')}</div>`;
  else if (x.g === 'check') h += `<div class="azw" style="background:var(--soft);border-color:var(--bd);color:var(--tx)">ℹ️ ${t('لم تُذكر درجة الحديث في المصدر، فراجع التخريج قبل الاعتماد عليه.')}</div>`;
  h += `<div class="azt">${esc(x.t)}</div>`;
  if (x.o) h += `<div class="azn">${esc(x.o)}</div>`;
  if (x.f) h += `<div class="azf">💡 ${esc(x.f)}</div>`;
  if (x.s) h += `<details class="azs"><summary>${t('المصدر والتخريج')}</summary><div>${esc(x.s)}</div></details>`;
  return h;
}
const AZ_FOOT = () => `<div class="azn" style="margin-top:14px">${t('درجات الأحاديث منقولة من التخريج الوارد في المصدر، وللتثبت راجع أهل العلم.')}<br>${t('المصادر: قاعدة Seen-Arabic (MIT) + حصن المسلم')}</div>`;
function azRoot() {
  let v = $('#azv'); if (!v) { v = document.createElement('div'); v.id = 'azv'; v.className = 'azv'; document.body.appendChild(v); document.body.style.overflow = 'hidden'; }
  return v;
}
function azClose() { const v = $('#azv'); if (v) v.remove(); document.body.style.overflow = ''; az.mode = ''; if ($('#mzbody')) renderMizan(); }
function azOpen(set, date) {
  az.date = date || today(); az.list = false;
  if (set === 'free' || set === 'salat') { az.mode = 'free'; az.set = 'free'; if (set === 'salat') az.free = 'f01'; }
  else {
    az.mode = 'set'; az.set = set; const L = azList(set); if (!L.length) return;
    const k = L.findIndex(x => azGet(az.date, set, x.id) < x.n); az.i = k < 0 ? L.length : k;
  }
  azRender();
}
function azRender() { const v = azRoot(); v.innerHTML = az.mode === 'free' ? azFreeHTML() : azSetHTML(); }
function azSetHTML() {
  const L = azList(az.set), d = az.date, title = t(AZ_TITLE[az.set]), pg = azProg(d, az.set);
  const hd = sub => `<div class="azh"><button data-a="azClose">✕</button><b>${title}</b><span>${sub}</span></div><div class="azbar"><i style="width:${pg.total ? Math.round(pg.done / pg.total * 100) : 0}%"></i></div>`;
  if (az.list) return hd(pg.done + '/' + pg.total) + `<div class="azb">${L.map((x, i) => { const dn = azGet(d, az.set, x.id) >= x.n; return `<button class="azli ${dn ? 'dn' : ''}" data-a="azGo" data-id="${i}"><i>✓</i><span>${esc(x.t.slice(0, 70))}</span><small>${azGet(d, az.set, x.id)}/${x.n}</small></button>`; }).join('')}</div><div class="azft"><button class="btn sec" data-a="azBack">${t('رجوع')}</button></div>`;
  if (az.i >= L.length) {
    const it = azItemFor(az.set), auto = S.settings.azAuto !== false, credited = it && mzGet(d).v[it.id] === 1;
    return hd(pg.done + '/' + pg.total) + `<div class="azb" style="text-align:center;padding-top:40px"><div style="font-size:64px">🌟</div><h2 style="color:var(--pri)">${t('ما شاء الله، أتممت')} ${title}</h2>${it ? (credited ? `<p>✅ ${t('احتُسب البند في تألق')}</p>` : auto ? `<p>${t('سيُحتسب البند في تألق')}</p>` : `<p>${t('الاحتساب التلقائي متوقف.')}</p><button class="btn" data-a="azCredit">${t('احتسب البند الآن')}</button>`) : ''}<p class="azn">${t('تقبّل الله منك')}</p></div><div class="azft"><div class="aznv"><button class="btn sec" data-a="azBack">${t('مراجعة الأذكار')}</button><button class="btn" data-a="azClose">${t('إغلاق')}</button></div></div>`;
  }
  const x = L[az.i], c = azGet(d, az.set, x.id), rem = Math.max(0, x.n - c), dn = rem === 0;
  return hd((az.i + 1) + '/' + L.length) + `<div class="azb">${azCard(x)}${AZ_FOOT()}</div><div class="azft"><button class="azc ${dn ? 'dn' : ''}" data-a="azTap" id="azc">${x.n === 1 ? `<b id="azrem">${dn ? '✓' : '☝️'}</b><small>${dn ? t('تمّت') : t('اضغط عند الانتهاء')}</small>` : `<b id="azrem">${dn ? '✓' : rem}</b><small>${dn ? t('تمّت') : t('متبقي من') + ' ' + x.n}</small>`}</button><div class="aznv"><button class="btn sec" data-a="azPrev">${t('السابق')}</button><button class="btn sec" data-a="azShowList">☰</button><button class="btn sec" data-a="azNext">${t('التالي')}</button></div></div>`;
}
function azFreeHTML() {
  const all = azAll(); if (!all.find(x => x.id === az.free)) az.free = (all.find(x => x.p) || all[0]).id;
  const x = azFreeItem(az.free), c = azGet(az.date, 'free', x.id), tot = azTotal(x.id);
  return `<div class="azh"><button data-a="azClose">✕</button><b>📿 ${t('السبحة')}</b><span>${fmtShort(az.date)}</span></div><div class="azbar"><i id="azbar" style="width:${Math.min(100, Math.round(c / x.n * 100))}%"></i></div>
  <div class="azb"><div class="azchips">${all.map(y => `<button data-a="azPick" data-id="${y.id}" class="${y.id === x.id ? 'on' : ''}">${esc(y.t.length > 22 ? y.t.slice(0, 22) + '…' : y.t)}</button>`).join('')}<button data-a="azAdd">＋ ${t('ذكر جديد')}</button></div>
  ${azCard(x)}<div class="azn">${t('اليوم')}: <b id="azday">${c}</b> • ${t('الإجمالي')}: <b id="aztot">${tot}</b> • ${t('الهدف')}: ${x.n}</div>${AZ_FOOT()}</div>
  <div class="azft"><button class="azc ${c >= x.n ? 'dn' : ''}" data-a="azFreeTap" id="azc"><b id="azrem">${c}</b><small>${t('الهدف')} ${x.n}</small></button><div class="aznv"><button class="btn sec" data-a="azFreeReset">↺ ${t('تصفير اليوم')}</button>${x.custom ? `<button class="btn sec" data-a="azEdit" data-id="${x.id}">✏️ ${t('تعديل')}</button>` : ''}</div></div>`;
}
const azFreeItem = id => azAll().find(x => x.id === id);
function azFinishSet() {
  const pg = azProg(az.date, az.set); if (pg.done < pg.total) return false;
  if (S.settings.azAuto !== false && azItemFor(az.set)) { azCredit(az.set, az.date); toast('✅ احتُسب بند الأذكار في تألق'); }
  return true;
}
function azCustomModal(id) {
  const c = id ? S.az.c.find(x => x.id === id) : null;
  openModal(c ? 'تعديل الذكر' : 'ذكر جديد', `<div class="lbl">${t('نص الذكر')}</div><textarea id="azfT" rows="3">${esc(c ? c.t : '')}</textarea><div class="lbl">${t('العدد المستهدف')}</div><input id="azfN" type="number" inputmode="numeric" min="1" value="${c ? +c.n : 33}"><div class="lbl">${t('الفضل (اختياري)')}</div><input id="azfF" value="${esc(c ? c.f || '' : '')}"><div class="lbl">${t('المصدر (اختياري)')}</div><input id="azfS" value="${esc(c ? c.s || '' : '')}"><div class="row" style="margin-top:12px"><button class="btn" data-a="azSave" data-id="${c ? c.id : ''}">${t('حفظ')}</button>${c ? `<button class="btn red" data-a="azDel" data-id="${c.id}">${t('حذف')}</button>` : ''}</div>`);
}
Object.assign(H, {
  azOpen:(id) => azOpen(id, (id === 'free' || id === 'salat') ? today() : ui.mzDate),
  azClose:() => azClose(),
  azTap:() => {
    const L = azList(az.set), x = L[az.i]; if (!x) return; const c = azGet(az.date, az.set, x.id);
    if (c >= x.n) { az.i++; azRender(); return; }
    azPut(az.date, az.set, x.id, c + 1); save(); azVib(12);
    if (c + 1 >= x.n) { azVib(40); const el = $('#azc'); if (el) { el.classList.add('dn'); const r = $('#azrem'); if (r) r.textContent = '✓'; }
      const fin = azFinishSet(), idx = az.i; setTimeout(() => { if (az.mode === 'set' && az.i === idx && $('#azv')) { az.i++; azRender(); } }, fin ? 500 : 350); }
    else { const r = $('#azrem'); if (r) r.textContent = x.n - c - 1; }
  },
  azNext:() => { const L = azList(az.set); if (az.i < L.length) { az.i++; azRender(); } },
  azPrev:() => { if (az.i > 0) { az.i--; azRender(); } },
  azShowList:() => { az.list = true; azRender(); },
  azBack:() => { az.list = false; if (az.i >= azList(az.set).length) az.i = 0; azRender(); },
  azGo:id => { az.i = +id; az.list = false; azRender(); },
  azCredit:() => { azCredit(az.set, az.date); toast('✅ تم الاحتساب'); azRender(); },
  azPick:id => { az.free = id; azRender(); },
  azFreeTap:() => {
    const x = azFreeItem(az.free); if (!x) return; const c = azGet(az.date, 'free', x.id) + 1;
    azPut(az.date, 'free', x.id, c); save(); azVib(10);
    const r = $('#azrem'); if (r) r.textContent = c; const d = $('#azday'); if (d) d.textContent = c; const tt = $('#aztot'); if (tt) tt.textContent = azTotal(x.id);
    const b = $('#azbar'); if (b) b.style.width = Math.min(100, Math.round(c / x.n * 100)) + '%';
    if (c === x.n) { azVib([80, 60, 80]); const el = $('#azc'); if (el) el.classList.add('dn'); toast('🌟 بلغت الهدف، ما شاء الله');
      const set = x.id === 'f01' ? 'salat' : 'free';
      if (S.settings.azAuto !== false && azItemFor(set)) { azCredit(set, az.date); toast('✅ احتُسب البند في تألق'); } }
  },
  azFreeReset:() => { if (!confirm(LANG === 'en' ? 'Reset today count for this dhikr?' : 'تصفير عدّاد اليوم لهذا الذكر؟')) return; azPut(az.date, 'free', az.free, 0); save(); azRender(); },
  azAdd:() => azCustomModal(''),
  azEdit:id => azCustomModal(id),
  azSave:id => {
    const tx = ($('#azfT').value || '').trim(), n = Math.max(1, Math.floor(+$('#azfN').value || 0)); if (!tx) { toast('اكتب نص الذكر'); return; }
    const o = {t:tx, n, f:($('#azfF').value || '').trim(), s:($('#azfS').value || '').trim()};
    if (id) { const c = S.az.c.find(x => x.id === id); if (c) Object.assign(c, o); } else { const nid = 'u_' + uid(); S.az.c.push({id:nid, ...o}); az.free = nid; }
    save(); closeModal(); azRender();
  },
  azDel:id => { if (!confirm(LANG === 'en' ? 'Delete this dhikr?' : 'حذف هذا الذكر؟')) return; S.az.c = S.az.c.filter(x => x.id !== id); az.free = ''; save(); closeModal(); azRender(); },
  azOpt:id => { S.settings[id] = S.settings[id] === false; save(); settingsPage(); }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = H[el.dataset.a]; if (f) f(el.dataset.id, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const el = e.target.closest('[data-enter]'); if (!el) return;
  e.preventDefault(); const f = H[el.dataset.enter]; if (f) f(el.dataset.id, el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'sq') { ui.q = e.target.value; renderList(); }
  else if (e.target.id === 'mq') { ui.mQ = e.target.value; renderMoneyPage(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'dp') { if (el.value) setDate(el.value); }
  else if (el.id === 'imf') {
    const file = el.files[0]; el.value = ''; if (!file) return;
    readImport(file).then(p => p ? importPreview(p) : toast('ملف غير مدعوم أو فاضي'));
  }
  else if (el.id === 'ntp') { applyTpl(el.value); }
  else if (el.id === 'mzdp') { if (el.value) { ui.mzDate = el.value; renderMizan(); } }
  else if (el.dataset.change === 'mzNum') { const r = mzGet(ui.mzDate, true); r.nums[el.dataset.id] = latin(el.value).trim(); save(); }
  else if (el.id === 'mc') { ui.mCat = el.value; renderMoneyPage(); }
  else if (el.id === 'mf') { ui.mFrom = el.value || ui.mFrom; if (ui.mTo < ui.mFrom) { ui.mTo = ui.mFrom; $('#mt').value = ui.mTo; } renderMoneyPage(); }
  else if (el.id === 'mt') { ui.mTo = el.value || ui.mTo; if (ui.mTo < ui.mFrom) { ui.mFrom = ui.mTo; $('#mf').value = ui.mFrom; } renderMoneyPage(); }
  else if (el.id === 'ac') { ui.aCat = el.value; renderAch(); }
  else if (el.id === 'af') { ui.aFrom = el.value || ui.aFrom; renderAch(); }
  else if (el.id === 'at') { ui.aTo = el.value || ui.aTo; renderAch(); }
  else if (el.dataset.change === 'budget') { S.settings.budget = Math.abs(parseFloat(latin(el.value))) || 0; save(); }
  else if (el.dataset.change === 'catBudget') { const v = Math.abs(parseFloat(latin(el.value))) || 0; if (v) S.settings.catBudgets[el.dataset.id] = v; else delete S.settings.catBudgets[el.dataset.id]; save(); }
});
addEventListener('pagehide', () => { if (S && fb.ready) cloudSync(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S && fb.ready) { clearTimeout(pushTimer); cloudSync(); } if (!document.hidden && S) { ensureRecurring(); focusUI(); if (ui.page === 'home') refreshHome(); if (fb.ready) cloudSync(); checkReminders(); } });

/* ============ التشغيل ============ */
(function init() {
  try { ui.agenda = localStorage.getItem('munjez_agenda') === '1'; } catch (e) {}
  try { const ss = JSON.parse(localStorage.getItem('munjez_session') || 'null'); if (ss && ss.mode) session = ss; } catch (e) {}
  if (FIREBASE_CONFIG && localStorage.getItem('munjez_redir')) {
    localStorage.removeItem('munjez_redir');
    loadFirebase().then(() => fb.auth.getRedirectResult()).then(r => { if (r && r.user) onGoogleUser(r.user); }).catch(() => {});
  }
  if (!session) { showLogin(); } else { loadData(); startApp(); }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
