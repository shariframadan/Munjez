/* ============ التكرار ============ */
function nextOcc(r, from) {
  switch (r) {
    case 'daily': return addDays(from, 1);
    case 'weekly': return addDays(from, 7);
    case 'monthly': return addMonths(from, 1);
    case 'yearly': return addMonths(from, 12);
    case 'first': { const d = pd(from); return ds(new Date(d.getFullYear(), d.getMonth() + 1, 1)); }
    case 'workdays': { let n = addDays(from, 1); while ([5, 6].includes(pd(n).getDay())) n = addDays(n, 1); return n; }
  }
  return null;
}
function ensureRecurring() {
  const td = today(); let changed = false;
  S.tasks.slice().forEach(x => {
    if (!x.repeat || x.repeat === 'none') return;
    if (!x.nextDue) x.nextDue = nextOcc(x.repeat, x.date);
    let n = 0;
    while (x.nextDue && x.nextDue <= td && n++ < 800) {
      if (x.nextDue >= addDays(td, -45)) {
        S.tasks.push({...x, id:uid(), date:x.nextDue, done:false, doneDay:null, doneAt:'', reminded:false, subs:x.subs.map(s => ({t:s.t, d:false, time:s.time || ''})), repeat:'none', nextDue:null, srcId:x.id, created:Date.now() + n});
      }
      x.nextDue = nextOcc(x.repeat, x.nextDue); changed = true;
    }
  });
  if (changed) save();
}

function subTimeModal(id, i) {

  openModal('🕒 ' + t('وقت التنفيذ'), `<p style="margin:0 0 8px"><b>${esc(s.t)}</b></p><input type="time" id="stm" value="${esc(s.time || '')}"><div class="row"><button class="btn" data-a="subTimeSave" data-id="${id}" data-i="${i}">${t('حفظ')}</button><button class="btn sec" data-a="subTimeClear" data-id="${id}" data-i="${i}">${t('مسح الوقت')}</button></div>`);
}

/* ============ الإعدادات ============ */
function settingsPage() {
  const s = S.settings, u = session;
  $('#page').innerHTML = `
  <div class="card"><div class="sect">${t('المظهر')}</div><div class="seg">${[['light', 'نهاري'], ['dark', 'ليلي'], ['auto', 'تلقائي']].map(([k, n]) => `<button data-a="theme" data-id="${k}" class="${s.theme === k ? 'on' : ''}">${t(n)}</button>`).join('')}</div></div>
  <div class="card"><div class="sect">${t('الحساب')}</div>
    <div class="set"><span>${u.mode === 'google' ? esc(u.name) : t('ضيف')}<br><small class="mut">${esc(u.email || '')}</small></span>${u.photo ? `<img src="${esc(u.photo)}" width="44" height="44" style="border-radius:50%" referrerpolicy="no-referrer">` : ''}</div>
    ${u.mode === 'google' ? `<button class="btn sec" data-a="signOut">${t('تسجيل خروج')}</button>` : `<button class="btn sec" data-a="google">${t('الدخول بجوجل')}</button>`}</div>
  <div class="card"><div class="sect">🔔 ${t('التنبيهات')}</div><div class="set"><span>${t('إشعارات الجهاز')}</span><b id="npStat">${t(permText())}</b></div><div class="row"><button class="btn sec" data-a="notifEnable">${t('تفعيل الإشعارات')}</button><button class="btn sec" data-a="notifTest">${t('تنبيه تجريبي')}</button></div><p style="font-size:13px;color:var(--mut);margin:8px 0 0">${t('التنبيهات بتشتغل والتطبيق مفتوح أو شغال في الخلفية. لو التطبيق مقفول تماماً، هتظهر لك أول ما تفتحه.')}</p></div>
  <div class="card"><div class="sect">📋 ${t('القوالب')}</div>${(S.templates || []).map(q => `<div class="set"><span>${esc(q.name)}<br><small class="mut">${esc(q.subs.join(' ← '))}</small></span><span style="display:flex;gap:4px"><button data-a="tplEdit" data-id="${q.id}">✏️</button><button data-a="tplDel" data-id="${q.id}">🗑️</button></span></div>`).join('') || `<div class="empty">${t('مفيش قوالب')}</div>`}<button class="btn sec" data-a="tplNew">+ ${t('قالب جديد')}</button></div>
  <div class="card"><div class="sect">${t('القفل')}</div><div class="set"><span>${s.pin ? '🔒 ' : ''}${s.pin ? t('إلغاء القفل') : t('تفعيل القفل برقم سري')}</span><button class="btn inl" data-a="pin">${s.pin ? t('إلغاء القفل') : '🔒'}</button></div></div>
  <div class="card"><div class="sect">${t('اللغة')}</div><button class="btn sec" data-a="lang">${LANG === 'en' ? 'عربي' : 'English'}</button></div>
  <div class="card"><div class="sect">${t('الميزانية')}</div>
    <div class="lbl">${t('الميزانية الشهرية')} (${t('ج.م')})</div><input id="bg" inputmode="decimal" value="${s.budget || ''}" data-change="budget">
    <div class="lbl">${t('ميزانية الفئات')}</div>${S.cats.map(c => `<div class="set"><span><i class="dot" style="background:${c.color}"></i> ${esc(catName(c.id))}</span><input style="width:130px" inputmode="decimal" value="${s.catBudgets[c.id] || ''}" data-change="catBudget" data-id="${c.id}"></div>`).join('')}
    <div class="lbl">${t('حساب الفلوس')}</div><div class="seg"><button data-a="moneyMode" data-id="all" class="${s.moneyMode === 'all' ? 'on' : ''}">${t('كل المهام')}</button><button data-a="moneyMode" data-id="done" class="${s.moneyMode === 'done' ? 'on' : ''}">${t('المكتملة فقط')}</button></div></div>
  <div class="card"><div class="sect">${t('الفئات')}</div>${S.cats.map(c => `<div class="set"><span><i class="dot" style="background:${c.color}"></i> ${esc(catName(c.id))}</span>${c.id.startsWith('c_') ? `<button data-a="delCat" data-id="${c.id}">🗑️</button>` : ''}</div>`).join('')}<button class="btn sec" data-a="addCat">+ ${t('فئة جديدة')}</button></div>
  <div class="card"><div class="sect">${t('النسخ الاحتياطي')}</div><div class="row"><button class="btn sec" data-a="expJson">💾 ${t('تصدير JSON')}</button><button class="btn sec" data-a="expAllCsv">📊 ${t('تصدير Excel')}</button></div>
    <div class="row"><button class="btn" data-a="importPick">📥 ${t('استيراد من ملف')}</button><input type="file" id="imf" accept=".json,.csv,.txt,.xlsx,.xls" hidden></div></div>
  <div class="card"><div class="sect">${t('عن التطبيق')}</div><p style="margin:0"><b>${t('منجز')}</b> - ${t('برنامج منجز بواسطة شريف رمضان')}</p><p style="color:var(--mut);margin:4px 0 10px">${t('رقم النسخة')}: ${VERSION}</p>
    <div class="row"><button class="btn sec" data-a="privacy">${t('سياسة الخصوصية')}</button><button class="btn sec" data-a="rate">⭐ ${t('قيّم التطبيق')}</button><button class="btn sec" data-a="install" id="inst2" ${deferredInstall ? '' : 'hidden'}>⬇️ ${t('تثبيت التطبيق')}</button></div></div>`;
}
function addCatModal() {
  openModal(t('فئة جديدة'), `<div class="lbl">${t('اسم الفئة')}</div><input id="cn"><div class="lbl">${t('اللون')}</div><input type="color" id="cc" value="#0ea5e9" style="padding:4px"><div class="row"><button class="btn" data-a="saveCat">${t('حفظ')}</button></div>`);
  setTimeout(() => $('#cn') && $('#cn').focus(), 50);
}
let deferredInstall = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('#instBtn'); if (b) b.hidden = false; const c = $('#inst2'); if (c) c.hidden = false; });
addEventListener('appinstalled', () => { deferredInstall = null; const b = $('#instBtn'); if (b) b.hidden = true; });

/* ============ الهيكل والتنقل ============ */
function shell() {
  applyLang();
  $('#root').innerHTML = `<header class="hdr"><div><div class="logo">${t('منجز')}</div><div class="sub">${t('برنامج منجز بواسطة شريف رمضان')}</div></div>
  <div class="hact"><span id="saved" class="saved">✓ ${t('تم الحفظ')}</span><button class="ib" id="instBtn" data-a="install" title="${t('تثبيت التطبيق')}" ${deferredInstall ? '' : 'hidden'}>⬇️</button><button class="ib" id="themeBtn" data-a="themeToggle"></button><button class="av" data-a="page" data-id="settings" id="avatar"></button></div></header>
  <main id="page"></main>
  <nav class="nav">${[['home', '🏠', 'اليوم'], ['money', '💰', 'المعاملات'], ['ach', '🏆', 'الإنجازات'], ['settings', '⚙️', 'الإعدادات']].map(([k, i, n]) => `<button data-a="page" data-id="${k}" data-nav="${k}"><span>${i}</span>${t(n)}</button>`).join('')}</nav>`;
  const av = $('#avatar'); av.innerHTML = session.photo ? `<img src="${esc(session.photo)}" referrerpolicy="no-referrer" alt="">` : esc((session.name || t('ضيف')).trim().charAt(0).toUpperCase());
  applyTheme(); showPage(ui.page);
}
function showPage(p) {
  ui.page = p; document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === p));
  if (p === 'home') homePage(); else if (p === 'money') moneyPage(); else if (p === 'ach') achPage(); else settingsPage();
  scrollTo(0, 0);
}
function refreshAll() { showPage(ui.page); }
function startApp() {
  LANG = S.settings.lang || 'ar'; savePrefs(); ensureRecurring(); shell(); checkReminders(); if (!remTimer) remTimer = setInterval(() => { checkReminders(); if (ui.agenda && ui.page === 'home' && ui.date === today() && !document.hidden) renderList(); }, 15000);
  if (S.settings.pin) showLock();
  if (FIREBASE_CONFIG && session.mode === 'google') loadFirebase().then(() => cloudSync()).catch(() => {});
}

/* ============ الأحداث ============ */
const H = {
  page:id => showPage(id),
  agenda:() => { ui.agenda = !ui.agenda; try { localStorage.setItem('munjez_agenda', ui.agenda ? '1' : ''); } catch (e) {} renderList(); },
  tplSave:() => tplFromForm(), tplNew:() => tplModal(), tplEdit:id => tplModal(id), tplDo:id => tplDo(id),
  tplDel:id => { if (!confirm(LANG === 'en' ? 'Delete template?' : 'حذف القالب؟')) return; S.templates = S.templates.filter(q => q.id !== id); save(); settingsPage(); },
  mPrev:() => { [ui.mFrom, ui.mTo] = mb(addMonths(ui.mFrom.slice(0, 8) + '01', -1)); $('#mf').value = ui.mFrom; $('#mt').value = ui.mTo; renderMoneyPage(); },
  mNext:() => { [ui.mFrom, ui.mTo] = mb(addMonths(ui.mFrom.slice(0, 8) + '01', 1)); $('#mf').value = ui.mFrom; $('#mt').value = ui.mTo; renderMoneyPage(); },
  mType:id => { ui.mType = id; document.querySelectorAll('#mtype button').forEach(b => { const on = b.dataset.id === id; b.className = on ? 'on ' + (id === 'all' ? '' : id) : ''; }); renderMoneyPage(); },
  txNew:() => txModal(), txEdit:id => txModal(id), txSave:id => txSave(id), txDel:id => txDel(id),
  xType:id => { ui.xType = id; document.querySelectorAll('#xtype button').forEach(b => { const on = b.dataset.id === id; b.className = on ? 'on ' + id : ''; }); },
  mCsv:() => download('munjez-transactions-' + today() + '.csv', txCSV(rangeStats(ui.mFrom, ui.mTo, mFilters())), 'text/csv;charset=utf-8'),
  mPdf:() => txPdf(),
  subTime:(id, el) => subTimeModal(id, +el.dataset.i),
  subTimeSave:(id, el) => { T(id).subs[+el.dataset.i].time = $('#stm').value || ''; save(); closeModal(); refreshHome(); },
  subTimeClear:(id, el) => { T(id).subs[+el.dataset.i].time = ''; save(); closeModal(); refreshHome(); },
  remSnooze:(id, el) => { const x = T(id); x.reminded = false; x.snooze = Date.now() + 10 * 60000; save(); el.closest('.hl').remove(); if (!$('#modal .hl')) closeModal(); },
  remDone:(id, el) => { const x = T(id); if (x && !x.done) { setDone(x, true); x.subs.forEach(s => { if (!s.d) { s.d = true; s.doneAt = nowHM(); } }); save(); refreshCurrent(); } el.closest('.hl').remove(); if (!$('#modal .hl')) closeModal(); },
  notifEnable:() => { if (!('Notification' in window)) return toast('غير مدعوم في المتصفح ده'); Notification.requestPermission().then(() => settingsPage()); },
  notifTest:() => { sysNotify('🔔 ' + t('منجز'), t('ده تنبيه تجريبي'), 'test'); beep(); toast('تم إرسال تنبيه تجريبي'); },
  themeToggle:() => { const dark = document.documentElement.dataset.theme === 'dark'; S.settings.theme = dark ? 'light' : 'dark'; save(); savePrefs(); applyTheme(); },
  theme:id => { S.settings.theme = id; save(); savePrefs(); applyTheme(); settingsPage(); },
  lang:() => { S.settings.lang = LANG === 'en' ? 'ar' : 'en'; LANG = S.settings.lang; save(); savePrefs(); shell(); },
  google:() => googleSignIn(), guest:() => enterGuest(), signOut:() => signOut(),
  closeModal:() => closeModal(),
  migrate:() => migrateGuest(true), noMigrate:() => migrateGuest(false),
  prevDay:() => setDate(addDays(ui.date, -1)), nextDay:() => setDate(addDays(ui.date, 1)), goToday:() => setDate(today()),
  pickDate:() => { const d = $('#dp'); try { d.showPicker(); } catch (e) { d.click(); } },
  catSel:id => { ui.cat = id; refreshHome(); },
  addCat:() => addCatModal(),
  saveCat:() => {
    const n = $('#cn').value.trim(); if (!n) return; const c = {id:'c_' + uid(), name:n, color:$('#cc').value}; S.cats.push(c); save(); closeModal();
    if (ui.page === 'home') { ui.cat = c.id; refreshHome(); } else refreshAll();
  },
  delCat:id => { if (!confirm(LANG === 'en' ? 'Delete category?' : 'حذف الفئة؟ المهام اللي فيها هتفضل بدون فئة.')) return; S.cats = S.cats.filter(c => c.id !== id); if (ui.cat === id) ui.cat = 'all'; save(); refreshAll(); },
  filter:id => { ui.filter = id; ui.agenda = false; try { localStorage.setItem('munjez_agenda', ''); } catch (e) {} refreshHome(); },
  toggle:id => toggleTask(id), subToggle:(id, el) => toggleSub(id, +el.dataset.i),
  subDel:(id, el) => { const x = T(id); x.subs.splice(+el.dataset.i, 1); syncDone(x); save(); refreshHome(); },
  openSub:id => { ui.openSub = id; renderList(); }, addSub:id => addSub(id),
  tmr:id => moveTask(id, addDays(T(id).date, 1)), toToday:id => moveTask(id, today()),
  del:id => delTask(id), edit:id => editModal(id), saveEdit:id => saveEdit(id),
  focusFor:id => { fo.taskId = id; focusModal(); }, focusOpen:() => focusModal(),
  focusGo:() => { fo.taskId = $('#ftask') ? $('#ftask').value : fo.taskId; fo.running ? focusPause() : focusStart(); },
  focusReset:() => focusReset(),
  prio:id => { ui.prio = id; document.querySelectorAll('#prio button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); },
  ntype:id => { ui.ntype = id; document.querySelectorAll('#ntype button').forEach(b => { const on = b.dataset.id === id; b.classList.toggle('on', on); }); },
  addTask:() => addTask(),
  chart:() => { ui.chart = !ui.chart; if (ui.page === 'money') renderMoneyPage(); else renderMoney(); },
  calPrev:() => { ui.calMonth = addMonths(ui.calMonth.slice(0, 8) + '01', -1); achPage(); }, calNext:() => { ui.calMonth = addMonths(ui.calMonth.slice(0, 8) + '01', 1); achPage(); },
  calDay:id => { ui.filter = 'day'; ui.cat = 'all'; ui.date = id; showPage('home'); },
  expPdf:() => expPdf(), expCsv:() => expCsv(false), expAllCsv:() => expCsv(true),
  expJson:() => download('munjez-backup-' + today() + '.json', JSON.stringify({app:'munjez', version:VERSION, exported:new Date().toISOString(), ...S}, null, 1), 'application/json'),
  importPick:() => $('#imf').click(),
  doImport:() => { const r = mergeImport(pendingImport); pendingImport = null; closeModal(); refreshAll(); toast(`${t('تم استيراد')} ${r.added}`); },
  moneyMode:id => { S.settings.moneyMode = id; save(); settingsPage(); },
  pin:() => pinModal(),
  pinOn:async () => { const a = $('#pin1').value, b = $('#pin2').value; if (!/^\d{4}$/.test(a)) return toast('اكتب 4 أرقام'); if (a !== b) return toast('الرقمين مش متطابقين'); S.settings.pin = await hashPin(a); save(); closeModal(); settingsPage(); toast('تم تفعيل القفل'); },
  pinOff:async () => { if (await hashPin($('#pin1').value) !== S.settings.pin) return toast('رقم سري خطأ'); S.settings.pin = null; save(); closeModal(); settingsPage(); toast('تم إلغاء القفل'); },
  privacy:() => openModal(t('سياسة الخصوصية'), `<p>${t('سياسة الخصوصية: بياناتك تتحفظ على جهازك فقط (وعلى حسابك السحابي لو سجلت بجوجل). لا تُباع ولا يشاهدها أحد غيرك، وتُحذف بحذف الحساب. لا نخزّن كلمة سر جوجل نهائياً. لا توجد إعلانات.')}</p>`),
  rate:() => openModal('⭐ ' + t('قيّم التطبيق'), `<div style="text-align:center;font-size:40px">${[1, 2, 3, 4, 5].map(n => `<button data-a="star" data-id="${n}" style="font-size:40px">⭐</button>`).join('')}</div>`),
  star:id => { localStorage.setItem('munjez_rating', id); closeModal(); toast('شكراً لتقييمك!'); },
  install:async () => { if (!deferredInstall) { toast(LANG === 'en' ? 'Use the browser menu ⋮ → Install app' : 'من قائمة المتصفح ⋮ ← تثبيت التطبيق'); return; } deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; const b = $('#instBtn'); if (b) b.hidden = true; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = H[el.dataset.a]; if (f) f(el.dataset.id, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const el = e.target.closest('[data-enter]'); if (!el) return;
  e.preventDefault(); const f = H[el.dataset.enter]; if (f) f(el.dataset.id, el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'sq') { ui.q = e.target.value; renderList(); }
  else if (e.target.id === 'mq') { ui.mQ = e.target.value; renderMoneyPage(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'dp') { if (el.value) setDate(el.value); }
  else if (el.id === 'imf') {
    const file = el.files[0]; el.value = ''; if (!file) return;
    readImport(file).then(p => p ? importPreview(p) : toast('ملف غير مدعوم أو فاضي'));
  }
  else if (el.id === 'ntp') { applyTpl(el.value); }
  else if (el.id === 'mc') { ui.mCat = el.value; renderMoneyPage(); }
  else if (el.id === 'mf') { ui.mFrom = el.value || ui.mFrom; if (ui.mTo < ui.mFrom) { ui.mTo = ui.mFrom; $('#mt').value = ui.mTo; } renderMoneyPage(); }
  else if (el.id === 'mt') { ui.mTo = el.value || ui.mTo; if (ui.mTo < ui.mFrom) { ui.mFrom = ui.mTo; $('#mf').value = ui.mFrom; } renderMoneyPage(); }
  else if (el.id === 'ac') { ui.aCat = el.value; renderAch(); }
  else if (el.id === 'af') { ui.aFrom = el.value || ui.aFrom; renderAch(); }
  else if (el.id === 'at') { ui.aTo = el.value || ui.aTo; renderAch(); }
  else if (el.dataset.change === 'budget') { S.settings.budget = Math.abs(parseFloat(latin(el.value))) || 0; save(); }
  else if (el.dataset.change === 'catBudget') { const v = Math.abs(parseFloat(latin(el.value))) || 0; if (v) S.settings.catBudgets[el.dataset.id] = v; else delete S.settings.catBudgets[el.dataset.id]; save(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) { ensureRecurring(); focusUI(); if (ui.page === 'home') refreshHome(); if (fb.ready) cloudSync(); checkReminders(); } });

/* ============ التشغيل ============ */
(function init() {
  try { ui.agenda = localStorage.getItem('munjez_agenda') === '1'; } catch (e) {}
  try { const ss = JSON.parse(localStorage.getItem('munjez_session') || 'null'); if (ss && ss.mode) session = ss; } catch (e) {}
  if (FIREBASE_CONFIG && localStorage.getItem('munjez_redir')) {
    localStorage.removeItem('munjez_redir');
    loadFirebase().then(() => fb.auth.getRedirectResult()).then(r => { if (r && r.user) onGoogleUser(r.user); }).catch(() => {});
  }
  if (!session) { showLogin(); } else { loadData(); startApp(); }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
